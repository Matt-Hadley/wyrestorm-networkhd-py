# PR Validation - Tests, Quality Checks, and Pre-release Build
name: PR Validation

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, ready_for_review]

permissions:
    contents: read
    pull-requests: write
    checks: write

concurrency:
    group: pr-validation-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    validate:
        name: Quality Checks & Tests (Python ${{ matrix.python-version }})
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup environment
              uses: ./.github/actions/setup-environment
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Run health check
              run: make health-check

            - name: Coverage report
              continue-on-error: true
              uses: 5monkeys/cobertura-action@ee5787cc56634acddedc51f21c7947985531e6eb # v14
              with:
                  path: coverage.xml
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  minimum_coverage: 0
                  fail_below_threshold: false
                  show_missing: false
                  show_branch: false
                  only_changed_files: false

            - name: Upload PR artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: pr-artifacts-${{ github.event.number }}-py${{ matrix.python-version }}
                  path: |
                      security-report.json
                      htmlcov/
                      dist/
                  retention-days: 30
