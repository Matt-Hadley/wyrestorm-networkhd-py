# Release Management - Automated Releases with Release Please
name: Release

on:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false # Don't cancel releases

jobs:
    release-please:
        name: Release Please
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: write
            issues: write # For labels
        outputs:
            releases_created: ${{ steps.release.outputs.releases_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  release-type: python

            - name: Debug Release Please outputs
              run: |
                  echo "Releases created: '${{ steps.release.outputs.releases_created }}'"
                  echo "Tag name: '${{ steps.release.outputs.tag_name }}'"

    test-matrix:
        name: Test on Python ${{ matrix.python-version }}
        needs: release-please
        if: ${{ needs.release-please.outputs.releases_created == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup environment
              uses: ./.github/actions/setup-environment
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Run health check
              run: make health-check

    publish:
        name: Publish to PyPI
        needs: [release-please, test-matrix]
        if: ${{ needs.release-please.outputs.releases_created == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: pypi
        permissions:
            contents: write # Upload release assets
            id-token: write # PyPI trusted publishing and attestations
            attestations: write
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup environment
              uses: ./.github/actions/setup-environment

            # test-matrix already ran the health check; coverage.xml feeds the badge
            - name: Test with coverage and build
              run: make test-cov build

            - name: Extract coverage percentage
              id: coverage
              continue-on-error: true
              run: |
                  if [ -f coverage.xml ]; then
                      COVERAGE=$(python -c "
                  import xml.etree.ElementTree as ET
                  try:
                      tree = ET.parse('coverage.xml')
                      root = tree.getroot()
                      line_rate = float(root.attrib['line-rate'])
                      print(f'{line_rate * 100:.0f}')
                  except:
                      print('0')
                  ")
                      echo "line-rate=$COVERAGE" >> $GITHUB_OUTPUT
                      echo "Coverage percentage: $COVERAGE%"
                  else
                      echo "line-rate=0" >> $GITHUB_OUTPUT
                      echo "Coverage file not found"
                  fi

            - name: Update coverage badge
              continue-on-error: true
              uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
              with:
                  auth: ${{ secrets.GIST_SECRET }}
                  gistID: ${{ secrets.GIST_ID }}
                  filename: coverage.json
                  label: coverage
                  message: ${{ steps.coverage.outputs.line-rate || 'N/A' }}%
                  valColorRange: ${{ steps.coverage.outputs.line-rate || '0' }}
                  maxColorRange: 100
                  minColorRange: 0
                  namedLogo: pytest

            - name: Upload release assets
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  tag_name: ${{ needs.release-please.outputs.tag_name }}
                  files: |
                      dist/*.whl
                  fail_on_unmatched_files: true

            - name: Attest build artifacts
              continue-on-error: true
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: "dist/*.whl"

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
              with:
                  packages-dir: dist/
                  attestations: true

    publish-docs:
        name: Publish Documentation
        needs: [release-please, test-matrix, publish]
        if: ${{ needs.release-please.outputs.releases_created == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            contents: read
            pages: write
            id-token: write # For GitHub Pages deployment
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup environment
              uses: ./.github/actions/setup-environment

            - name: Install documentation dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[docs,rs232]"

            - name: Build documentation
              run: mkdocs build --clean --strict

            - name: Setup Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Upload documentation artifacts
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: ./site

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
